[project]
name = "craft-the-groove-api"
version = "0.1.0"
description = "API wrapper for Spotify"
authors = [
    {name = "Rocio Barragan Moreno"},
    {name = "Daniel Fernandez Merida"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "spotipy (>=2.26.0,<3.0.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.15,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]
